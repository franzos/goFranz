<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} — Franz Geffke</title>
  <style>
    @font-face {
      font-family: 'Overpass';
      font-style: normal;
      font-weight: 300;
      font-display: swap;
      src: local('Overpass Light'), url('/assets/fonts/overpass-v1-latin-300.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Overpass';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('Overpass Regular'), url('/assets/fonts/overpass-v1-latin-regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Overpass';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: local('Overpass Bold'), url('/assets/fonts/overpass-v1-latin-700.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Overpass';
      font-style: normal;
      font-weight: 900;
      font-display: swap;
      src: local('Overpass Black'), url('/assets/fonts/overpass-v1-latin-900.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Overpass Mono';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('Overpass Mono'), url('/assets/fonts/overpass-mono-v2-latin-regular.woff2') format('woff2');
    }

    :root {
      --paper: #f6f2ea;
      --ink: #1a1611;
      --read: #2c271f;
      --soft: #615a4e;
      --line: #e3dccd;
      --accent: #451668;
      --amber: #b4621f;
    }

    * { box-sizing: border-box; }
    html { padding: 0 2rem; }
    body {
      font-family: 'Overpass', system-ui, sans-serif;
      font-size: 1em;
      line-height: 1.55;
      max-width: 960px;
      margin: 2rem auto;
      background: var(--paper);
      color: var(--read);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { margin: 0; color: var(--ink); font-family: 'Overpass', sans-serif; }
    h2 {
      margin-top: 1.6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -.01em;
      font-size: 1.25rem;
      padding-top: .9rem;
      position: relative;
    }
    h2::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 42px; height: 7px;
      background: var(--accent);
    }
    h3 { margin-top: 1rem; font-weight: 700; font-size: 1.05rem; }
    .mt-1 { margin-top: 1rem; }
    .text-center { text-align: center; }
    .item-header { display: flex; justify-content: space-between; gap: 1rem; }
    p { margin-block-start: 0.5rem; margin-block-end: 0.5rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    strong, b { color: var(--ink); }

    .contact h2 { font-size: 1.7rem; padding-top: 0; }
    .contact h2::before { content: none; }
    .contact-info { display: flex; align-items: center; gap: 5px; justify-content: center; }
    .contact .mono,
    .contact p { font-family: 'Overpass Mono', monospace; font-size: .82rem; letter-spacing: .02em; color: var(--soft); }
    .contact a { color: var(--amber); }

    .logo { width: 1rem; height: 1rem; }

    @media print {
      html { padding: 0; }
      body {
        margin: 0;
        font-size: 0.8125em;
        background: #fff;
        color: #000;
      }
      h1, h2, h3, strong, b { color: #000; }
      h2::before { background: #000; }
      a { color: #000; }
      .contact p, .contact .mono { color: #000; }
      .contact a { color: #000; }
    }
  </style>
  {% if page.md_twin_url %}<link rel="alternate" type="text/markdown" href="{{ page.md_twin_url | absolute_url }}">{% endif %}
  </head>

  <body>
    <div class="container-fluid">
      <div class="content">
        <div class="contact">
          <h2>Franz Geffke</h2>
          <p style="margin-bottom: 1rem;">
            Remote, Lisbon (GMT +1)
            <br><a href="mailto:mail@gofranz.com?subject=Let's work together">mail@gofranz.com</a> &bull; <a href="https://gofranz.com">gofranz.com</a> &bull; <a href="https://github.com/franzos">GitHub</a>
            <br><small>Fluent in English / German</small>
          </p>
        </div>
        {{ content }}
      </div>
    </div>
  </body>
</html>
