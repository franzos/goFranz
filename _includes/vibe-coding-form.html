<div id="vibe-coding-form">
  <form action="https://api.formshive.com/v1/digest/60d8a103-62a4-47a0-91b2-02d363ab8851" method="post" class="contact-form">
    <div class="form-group">
      <label for="name">Your name</label>
      <input type="text" name="name" id="name" class="form-control" required>
    </div>
    
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" name="email" id="email" class="form-control" required>
    </div>
    
    <div class="form-group">
      <label for="preferred_contact">Preferred contact method</label>
      <select name="preferred_contact" id="preferred_contact" class="form-control">
        <option value="email">Email</option>
        <option value="signal">Signal</option>
        <option value="telegram">Telegram</option>
        <option value="discord">Discord</option>
        <option value="matrix">Matrix</option>
        <option value="whatsapp">WhatsApp</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="contact_info">Contact details (username, phone, etc.)</label>
      <input type="text" name="contact_info" id="contact_info" class="form-control" placeholder="@username, phone number, etc.">
    </div>
    
    <div class="form-group">
      <label for="platform">Which platform generated your app?</label>
      <select name="platform" id="platform" class="form-control">
        <option value="loveable">Loveable</option>
        <option value="bolt">Bolt.new</option>
        <option value="replit">Replit</option>
        <option value="other">Other</option>
        <option value="multiple">Multiple platforms</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="app_description">Brief description of your application</label>
      <textarea name="app_description" id="app_description" class="form-control" rows="4" placeholder="What does your app do?" required></textarea>
    </div>
    
    <div class="form-group">
      <label for="main_issues">What problems are you experiencing?</label>
      <textarea name="main_issues" id="main_issues" class="form-control" rows="4" placeholder="Security concerns, performance issues, bugs, etc." required></textarea>
    </div>
    
    <div class="form-group">
      <label for="urgency">Timeline</label>
      <select name="urgency" id="urgency" class="form-control">
        <option value="asap">ASAP (within 48 hours)</option>
        <option value="week">This week</option>
        <option value="month">Within a month</option>
        <option value="flexible">Flexible timing</option>
      </select>
    </div>

    <input type="hidden" name="_subject" value="Vibe Coding Rescue Request">
    <button type="submit" class="btn btn-outline-secondary">Request Help</button>
  </form>
</div>
