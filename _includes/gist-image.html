<div class="image-wrapper narrow">
  <button type="button" class="thumbnail"
     data-bs-toggle="modal"
     data-bs-target="#imageModal"
     data-image="/assets/images/blog/{{ include.image }}"
     data-caption="{% if include.caption %}{{ include.caption }}{% else %}{{ include.image }}{% endif %}"
     aria-label="View larger image: {% if include.caption %}{{ include.caption }}{% else %}{{ include.image }}{% endif %}"
     title="Click to view larger image">
    <img src="/assets/images/blog/{{ include.image }}" alt="{% if include.caption %}{{ include.caption }}{% else %}{{ include.image }}{% endif %}" loading="lazy">
    {% if include.caption %}<span class="caption">{{ include.caption }}</span>{% endif %}
  </button>
</div>
