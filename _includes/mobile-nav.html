<!-- Bootstrap Offcanvas Mobile Navigation -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileNav" aria-labelledby="mobileNavLabel">
  <div class="offcanvas-header">
    <p class="offcanvas-title" id="mobileNavLabel">
      <a href="/">
        <img alt="Franz" src="/assets/images/gofranz.svg" class="logo-light" height="30">
        <img alt="Franz" src="/assets/images/gofranz_white.svg" class="logo-dark" height="30">
      </a>
    </p>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <nav aria-label="Mobile navigation">
      <ul class="nav nav-pills flex-column">
        <li class="nav-item">
          <a class="nav-link{% if page.url == "/" %} active{% endif %}"{% if page.url == "/" %} aria-current="page"{% endif %} href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if page.url == "/about/" %} active{% endif %}"{% if page.url == "/about/" %} aria-current="page"{% endif %} href="/about/">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if page.url contains "/blog/" %} active{% endif %}"{% if page.url contains "/blog/" %} aria-current="page"{% endif %} href="/blog/">Blog</a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if page.url == "/contact/" %} active{% endif %}"{% if page.url == "/contact/" %} aria-current="page"{% endif %} href="/contact/">Contact</a>
        </li>
        <li class="nav-item theme-nav">
          <span class="theme-nav-label">Theme</span>
          {% include theme-toggle.html %}
        </li>
      </ul>
    </nav>
  </div>
</div>
