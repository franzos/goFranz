title: Franz Geffke
description: "Full-Stack Developer, AI Orchestrator, ½ Machine - Personal website and blog covering web development, AI integration, system architecture, and technology insights"
baseurl: ""
url: "https://gofranz.com"
destination: _site/
image: /assets/images/og-default.png
mapbox_token: "pk.eyJ1IjoiZGtrbWEiLCJhIjoiU05aOVdrRSJ9._Ahj-qQ5cCyLUCM2dp4tAw"

twitter:
  username: franzos

mastodon:
  instance: social.tchncs.de
  user: franzs

# Build settings
markdown: kramdown
encoding: utf-8

kramdown:
  input: GFM
  syntax_highlighter: rouge

pagination:
  enabled: true
  per_page: 20
  permalink: "/blog/page/:num/"

plugins:
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

include:
  - .well-known

# Exclude from processing
exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - yarn.lock
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - node_modules
  - vendor
  - .gitlab-ci.yml
  - src
  - README.md
  - CLAUDE.md
  - deploy.sh
  - Dockerfile
  - esbuild.config.js
  - TRAIL.md
  - TODO.md
  - FRANZ-GUIDE.md
  - public
  - _design
  - assets/css/*.map

collections:
  posts:
    output: true
    permalink: /blog/:title/
  work:
    output: true
    permalink: /work/:title/
  clients:
    output: true
    permalink: /client/:title/
  testimonials:
    output: false
  til:
    output: true
    permalink: /til/:title/
  recipes:
    output: true
    permalink: /cooking/recipes/:title/
  software:
    output: true
    permalink: /software/:name/

# Site-wide default share image (jekyll-seo-tag reads page.image, so set a default)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  - scope:
      path: ""
      type: software
    values:
      twitter:
        card: summary_large_image
  - scope:
      path: ""
      type: posts
    values:
      twitter:
        card: summary_large_image
  - scope:
      path: "assets"
    values:
      sitemap: false
